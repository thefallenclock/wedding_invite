<!DOCTYPE html>
<html lang="en" class="pre-open">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rahul &amp; Vibhuti &mdash; Wedding Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<audio id="bg-music" src="assets/bg-music.mp3" loop preload="none"></audio>
<button id="mute-toggle" class="mute-btn" aria-label="Toggle music">&#128266;</button>

<nav class="progress-nav" id="progress-nav">
  <button data-target="names" aria-label="Names"></button>
  <button data-target="haldi" aria-label="Haldi"></button>
  <button data-target="sangeet" aria-label="Sangeet"></button>
  <button data-target="wedding" aria-label="Wedding"></button>
  <button data-target="rsvp" aria-label="RSVP"></button>
</nav>

<div class="invite">

<!-- 1. LANDING -->
<section class="section" id="landing">
  <div class="slide-frame">
    <div class="section-bg" style="background-image:url('assets/bg-landing.jpg')"></div>
    <div class="hang-wrap"><img class="hang" src="assets/hang-landing.png" alt="" /></div>
    <img class="peacock left" src="assets/peacock-1.png" alt="" />
    <img class="peacock right" src="assets/peacock-2.png" alt="" />

    <div class="envelope-wrap" id="envelope">
      <img src="assets/envelope.png" alt="Tap to open invitation" />
    </div>
    <p class="tap-label">tap to open</p>
  </div>
</section>

<!-- 2. NAMES: full invitation text is baked into the artwork itself, so
     we fade the whole picture slowly rather than a separate text layer -->
<section class="section" id="names" data-fade-target="bg" data-fade-rate="0.9">
  <div class="slide-frame">
    <div class="section-bg parallax-bg" style="background-image:url('assets/bg-names.jpg')"></div>
    <div class="hang-wrap"><img class="hang" src="assets/hang-names.png" alt="" /></div>
  </div>
</section>

<!-- 3. HALDI -->
<section class="section event-section" id="haldi">
  <div class="slide-frame">
    <div class="section-bg" style="background-image:url('assets/bg-haldi.jpg')"></div>
    <div class="hang-wrap"><img class="hang" src="assets/hang-haldi.png" alt="" /></div>
    <div class="scratch-wrap">
      <div class="reveal-card"><img src="assets/details-haldi.png" alt="Haldi date, time and venue" /></div>
      <canvas class="scratch-canvas"></canvas>
      <div class="scratch-hint">scratch to reveal details</div>
    </div>
  </div>
</section>

<!-- 4. SANGEET -->
<section class="section event-section" id="sangeet">
  <div class="slide-frame">
    <div class="section-bg" style="background-image:url('assets/bg-sangeet.jpg')"></div>
    <div class="hang-wrap"><img class="hang" src="assets/hang-sangeet.png" alt="" /></div>
    <div class="scratch-wrap">
      <div class="reveal-card"><img src="assets/details-sangeet.png" alt="Sangeet date, time and venue" /></div>
      <canvas class="scratch-canvas"></canvas>
      <div class="scratch-hint">scratch to reveal details</div>
    </div>
  </div>
</section>

<!-- 5. WEDDING -->
<section class="section event-section" id="wedding">
  <div class="slide-frame">
    <div class="section-bg" style="background-image:url('assets/bg-wedding.jpg')"></div>
    <div class="hang-wrap"><img class="hang" src="assets/hang-wedding.png" alt="" /></div>
    <div class="scratch-wrap">
      <div class="reveal-card"><img src="assets/details-wedding.png" alt="Wedding timings" /></div>
      <canvas class="scratch-canvas"></canvas>
      <div class="scratch-hint">scratch to reveal details</div>
    </div>
  </div>
</section>

<!-- 6. RSVP (closing) -->
<section class="section" id="rsvp">
  <div class="slide-frame">
    <div class="section-bg parallax-bg" style="background-image:url('assets/bg-landing.jpg')"></div>
    <div class="hang-wrap"><img class="hang" src="assets/hang-landing.png" alt="" /></div>
    <div class="content">
      <h2>Awaiting your presence</h2>
      <div class="rsvp-names">Rahul &amp; Vibhuti</div>
      <p>22nd October, 2026</p>
      <iframe class="map-frame" loading="lazy"
        src="https://maps.google.com/maps?q=Courtyard+by+Marriott+Agra&output=embed">
      </iframe>
      <p class="placeholder-note">Map is pinned to the Haldi venue for now &mdash; confirm the main wedding-day venue and we'll update this.</p>
    </div>
  </div>
</section>

</div><!-- /.invite -->

<script src="script.js"></script>
</body>
</html>
